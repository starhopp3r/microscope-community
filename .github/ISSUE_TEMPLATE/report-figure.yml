name: Report a figure
description: A figure that is broken, unsafe, copied, or breaks the code of conduct.
title: "Report: "
labels: [report]
body:
  - type: markdown
    attributes:
      value: |
        For a security problem in the checks themselves, don't use this form: see SECURITY.md.
  - type: input
    id: figure
    attributes:
      label: Figure
      description: Its folder, figures/<author>/<id>, or a link to it.
      placeholder: figures/octo-cat/stomata-leaf-block
    validations:
      required: true
  - type: dropdown
    id: reason
    attributes:
      label: Reason
      options:
        - It's my work, shared without my permission
        - It copies someone else's work
        - It's unsafe (tracks, attacks or misleads viewers)
        - It's hateful, abusive or otherwise breaks the code of conduct
        - It's broken or wrong
        - Something else
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Details
      description: What's wrong, and any links that show it. For a rights claim, say what work is yours and where it was first published.
    validations:
      required: true
